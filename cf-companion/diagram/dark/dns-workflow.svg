<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="dt">
<title id="dt">CF Companion: the automatic Cloudflare DNS workflow for Traefik containers</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arrm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1a1aa"/></marker>
</defs>
<rect width="1200" height="750" fill="#09090b"/>
<text x="60" y="64" font-size="12" fill="#a1a1aa" font-weight="600" letter-spacing="1.5">CF COMPANION &#183; OPEN SOURCE (MIT)</text>
<text x="60" y="102" font-size="28" fill="#fafafa" font-weight="700">DNS records that manage themselves</text>
<text x="60" y="130" font-size="14" fill="#a1a1aa" >A lightweight sidecar that watches Traefik and provisions Cloudflare DNS as containers come and go.</text>
<line x1="298" y1="295" x2="342" y2="295" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
<line x1="588" y1="295" x2="632" y2="295" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
<line x1="878" y1="295" x2="922" y2="295" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
<rect x="60" y="200" width="230" height="190" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
<text x="80" y="234" font-size="15" fill="#fafafa" font-weight="700">Docker container</text>
<rect x="80" y="250" width="132" height="24" rx="6" fill="#09090b" stroke="#27272a"/>
<text x="146.0" y="265.96" font-size="11" fill="#a1a1aa" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">traefik.* labels</text>
<text x="80" y="304" font-size="12" fill="#a1a1aa" >A service starts with</text>
<text x="80" y="322" font-size="12" fill="#a1a1aa" >Traefik labels — no</text>
<text x="80" y="340" font-size="12" fill="#a1a1aa" >separate config file.</text>
<rect x="350" y="200" width="230" height="190" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
<text x="370" y="234" font-size="15" fill="#fafafa" font-weight="700">Traefik</text>
<text x="370" y="274" font-size="12" fill="#a1a1aa" >The reverse proxy —</text>
<text x="370" y="292" font-size="12" fill="#a1a1aa" >a new route appears</text>
<text x="370" y="310" font-size="12" fill="#a1a1aa" >the moment the</text>
<text x="370" y="328" font-size="12" fill="#a1a1aa" >container is up.</text>
<rect x="640" y="200" width="230" height="190" rx="8" fill="#18181b" stroke="#2563eb" stroke-width="2"/>
<text x="660" y="234" font-size="15" fill="#fafafa" font-weight="700">CF Companion</text>
<text x="660" y="254" font-size="12" fill="#a1a1aa" font-style="italic">the sidecar</text>
<text x="660" y="292" font-size="12" fill="#a1a1aa" >Watches the Traefik</text>
<text x="660" y="310" font-size="12" fill="#a1a1aa" >API. Sees the route,</text>
<text x="660" y="328" font-size="12" fill="#a1a1aa" >knows the hostname.</text>
<rect x="930" y="200" width="230" height="190" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
<text x="950" y="234" font-size="15" fill="#fafafa" font-weight="700">Cloudflare DNS</text>
<rect x="950" y="250" width="140" height="24" rx="6" fill="#09090b" stroke="#27272a"/>
<text x="1020.0" y="265.96" font-size="11" fill="#a1a1aa" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">CNAME &#183; A record</text>
<text x="950" y="304" font-size="12" fill="#a1a1aa" >Provisioned on</text>
<text x="950" y="322" font-size="12" fill="#a1a1aa" >container start —</text>
<text x="950" y="340" font-size="12" fill="#a1a1aa" font-family="'JetBrains Mono', ui-monospace, monospace">app.your.domain</text>
<text x="950" y="358" font-size="12" fill="#a1a1aa" >just resolves.</text>
<text x="60" y="478" font-size="12" fill="#a1a1aa" font-weight="600" letter-spacing="1.5">AND WHEN THE CONTAINER STOPS</text>
<rect x="60" y="496" width="300" height="96" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" stroke-dasharray="6 4"/>
<text x="80" y="528" font-size="14" fill="#fafafa" font-weight="700">Container stops</text>
<text x="80" y="554" font-size="12" fill="#a1a1aa" >The route disappears</text>
<text x="80" y="571" font-size="12" fill="#a1a1aa" >from Traefik.</text>
<line x1="368" y1="544" x2="442" y2="544" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrm)"/>
<rect x="450" y="496" width="300" height="96" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" stroke-dasharray="6 4"/>
<text x="470" y="528" font-size="14" fill="#fafafa" font-weight="700">CF Companion notices</text>
<text x="470" y="554" font-size="12" fill="#a1a1aa" >The watcher sees the</text>
<text x="470" y="571" font-size="12" fill="#a1a1aa" >route go away.</text>
<line x1="758" y1="544" x2="832" y2="544" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrm)"/>
<rect x="840" y="496" width="300" height="96" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" stroke-dasharray="6 4"/>
<text x="860" y="528" font-size="14" fill="#fafafa" font-weight="700">Record removed</text>
<text x="860" y="554" font-size="12" fill="#a1a1aa" >Cleaned up automatically.</text>
<text x="860" y="571" font-size="12" fill="#a1a1aa" >No orphans.</text>
<text x="60" y="668" font-size="13" fill="#a1a1aa" >Label-driven — nothing to maintain but your compose file. Python, MIT licensed, easy to extend.</text>
</svg>
